[project]
name = "git-ocr-hub"
version = "1.0.0"
description = "Multi-repository Git workspace supervisor and local AI code review orchestrator powered by llama.cpp and OpenCodeReview."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Laurent" }
]
keywords = [
    "git",
    "code-review",
    "ai-code-review",
    "llama-cpp",
    "opencode-review",
    "multi-repo",
    "local-llm",
    "orchestrator",
    "static-analysis",
    "tool-calling",
    "qwen",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/laurentvv/git-ocr-hub"
Repository = "https://github.com/laurentvv/git-ocr-hub"

[project.scripts]
git-ocr-hub = "orchestrator:main"
